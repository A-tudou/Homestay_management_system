server:
  port: 8080

spring:
  application:
    name: homestay-booking
  datasource:
    url: jdbc:mysql://localhost:3306/homestay?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: homestay_app
    password: "Homestay@2026"
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # 每次启动执行 schema.sql，脚本内全部是 IF NOT EXISTS，可反复执行
      mode: always
      schema-locations: classpath:db/schema.sql
      encoding: UTF-8
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，上线前可改为 org.apache.ibatis.logging.nologging.NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    # HS256 要求密钥至少 32 字节，生产环境务必替换
    secret: homestay-booking-dev-secret-key-change-me-in-production-2026
    expire-minutes: 1440
  seed:
    # 演示数据开关：true 时仅当房型表为空才写入，本地体验可临时打开
    enabled: false

logging:
  level:
    com.homestay: debug
